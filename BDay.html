<!DOCTYPE html>
<html>
<head>
<style type="text/css">
#face {
	width:800px;
	height:800px;
background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTp2bvZjub00dUrPW00tlPDQCJbEjzGevzk8A&s");
background-size: cover;
background-repeat: no-repeat;
background color: blueviolet;
}

</style>
</head>
<body>
<center>
	<div id="face">
	</div>

</center>
<script type="text/javascript">
	let counter = 0
	document.addEventListener("click", function(){
		counter=counter+1

		if (counter==1){
			face.style.backgroundImage = "url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPKIDa5WBtFAq431r7oBQx41T6GNFtZCs5oA&s)"
		}


		if (counter==2){
			face.style.backgroundImage = "url(https://img.freepik.com/premium-vector/hand-drawn-retro-smiley-emoji-illustration-white_921039-20728.jpg?semt=ais_hybrid&w=740&q=80)"





		}
		if (counter==3){
			face.style.backgroundImage = "url(https://media.istockphoto.com/id/1356265093/vector/birthday-party-emoji-celebrate-emoticon-happy-birthday-face-hat-emoji.jpg?s=612x612&w=0&k=20&c=cwQdbKQQaEPo1wF-TNMCOllGYY3k3pITTAt78MTWfK0=)"





		}
		if (counter==3){
			face.style.backgroundImage = "url(https://media.istockphoto.com/id/1322876201/vector/happy-birthday-typography.jpg?s=612x612&w=0&k=20&c=OZzc-si4IvdhHCIIR7GMPE8dT-qde7f75yX9E25idlE=)"


		}

		if (counter==4){
			face.style.backgroundImage = "url(https://www.paullinatest.themarcusnews.com/wp-content/uploads/2018/06/giphy.gif)"
		}


	})



</script>

</body>
</html>
