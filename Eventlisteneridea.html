<!DOCTYPE html>
<html>
<head>
	<style>
		
#pac{

	width: 150px;
	height: 1500px;

	background-size: contain;
	background-repeat: no-repeat;
	position: absolute;
	top: 150px;

	left:400px;
	animation-duration: .4s;
	animation-iteration-count: infinite;
	background-image: url(https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Original_PacMan.svg/1024px-Original_PacMan.svg.png);
}

@keyframes mouth{

	0%{
		background-image:url("https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Original_PacMan.svg/1024px-Original_PacMan.svg.png");
	}


	100%{
		background-image:url("https://art.pixilart.com/thumb/d6aecdbae0423a4.png");
	}
}

	</style>
</head>
<body>

<div id= "pac">
</div>


</body>
<script type="text/javascript">

pac.style.left ="400px"
document.addEventListener("click", function(){
	pac.style.animationName="mouth"
	// pac.style.left=pac.style.left+1+"px"
})

document.addEventListener("keydown", function(event){
	if (event.key=="ArrowRight"){
		pac.style.left=parseInt(pac.style.left)+10+"px"
		pac.style.transform="rotateY(180deg)"
	}

	if (event.key=="ArrowLeft"){
		pac.style.left=parseInt(pac.style.left)-10+"px"
		pac.style.transform="rotateY(-180deg)"

		
	}
})

















</script>
</html>
