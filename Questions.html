<!DOCTYPE html>
<html>
<head>
	<style type="text/css">
.things{

	width: 200px;
	height:200px;
	display: inline-block;
	background-color: palegreen;
background-image: url("https://img.freepik.com/premium-photo/question-mark-3d-icon-cartoon-style-isolated-transparent-background_1283998-291.jpg?semt=ais_hybrid&w=740&q=80");
background-size: contain;
background-repeat: no-repeat;
}


	</style>



</head>
<body>
<script type="text/javascript">

function create (){
let question = document.createElement("div")
document.body.appendChild(question)
question.classList.add("things")

}	

document.addEventListener("click", create)



</script>
</body>
</html>
