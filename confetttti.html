<!DOCTYPE html>
<html>
<head>
	<style type="text/css">
		.confetti{
			width: 10px;
			height:25px;
			/*background-color: gold;*/
			display: inline-block;
			/*border: 3px solid ghostwhite;*/
			border-radius: 12px;
			position: absolute;
			animation-name: swing3d;
			animation-duration: 1.8s;
			animation-iteration-count: infinite;
			animation-direction:alternate;
			animation-timing-function: ease-in-out;
			
		}
		body{
			background-color: black;
		}
@keyframes swing{
	from {
		transform: rotate(var(--starRot));
	}
	to {
		transform: rotate(var(--endRot));
	}
	}
	@keyframes swing3d {
		from{
			transform: rotateZ(180deg)rotateX(-60deg) rotateY(-180deg);
		}
		to{
			transform: rotateZ(180deg)rotateX(50deg)rotateY(180deg);
		}
	}
	</style>
</head>
<body>
    <button id="btn">drop Confetti</button>
<input type="range" min="1" max="10" id="slider" step="1">
    <input type="color" value="#ff0000" id="colorPicker">
<script type="text/javascript">
	// function randomPlace(min,max) {
	// 	const minCeile
	// }
 let colors = ["#457b9d", "#a8dadc", "#e9edc9", "#cdb4db", "#fca311"]
 // let colors = ["blue", "green", "red"]
 console.log(colors[3])
let colorpicker = document.getElementById("colorPicker")
console.log(colorpicker.value)
 let dropConfettiBtn = document.getElementById("btn")
let slider = document.getElementById("slider")

	function makeConfets(){
		let square = document.createElement("div")
		square.classList.add("confetti")
		document.body.appendChild(square)
		let r= Math.round(Math.random()*255)
		let g= Math.round(Math.random()*300)
		let b= Math.round(Math.random()*280)
		let big= Math.round(Math.random()*30)
		let rotation = Math.random()*360

		let startRot = Math.random()*-40 +"deg"
		let endRot = Math.random()*70 + "deg"

        let randomColor = Math.floor(Math.random()*colors.length)
        square.classList.add("confetti")
        // square.style.backgroundColor=colors[randomColor]
        square.style.backgroundColor=colorpicker.value


		square.style.setProperty("--startRot", startRot)
		square.style.setProperty("--endRot", endRot)




		function fall(){
			let Fallfactor = 2
			square.style.top = parseInt(square.style.top) + Fallfactor + "px"
			if(parseInt(square.style.top) > 1000){
				square.style.top = Math.random() *100 +"px"
			}

		}
		setInterval(fall, 1)
		// square.style.backgroundColor = "rgb("+r+", "+g+", "+b+")"
		square.style.width = big+"px"
		square.style.height = big+"px"
		square.style.top = Math.random() * window.innerWidth + "px"
		square.style.left = Math.random() * window.innerWidth + "px"
		square.style.transform = "rotate(" + rotation + "deg)"
	}
// setInterval(makeConfets, 80)

dropConfettiBtn.addEventListener("click", function(){
console.log("unaclick")
    for (let i = 0; i < slider.value; i++) {
        makeConfets()
    }
})

</script>
</body>
</html>
