<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dobby's Castle Defender: Final Edition</title>
    <style>
        body { background-color: #0d0a07; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; color: #fff; }
        #game-box { position: relative; width: 800px; height: 600px; border: 10px solid #2d1f14; background: #c2a385; box-shadow: 0 0 60px rgba(0,0,0,0.9); overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(10, 5, 2, 0.95); z-index: 100; text-align: center; }
        #hud { position: absolute; top: 15px; left: 15px; z-index: 50; pointer-events: none; text-shadow: 2px 2px 0 #000; font-weight: bold; font-size: 18px; line-height: 1.4; color: #fff; }
        .blink { animation: blinker 1s linear infinite; color: #ffcc00; font-size: 20px; }
        @keyframes blinker { 50% { opacity: 0; } }
        h1 { color: #f4e4bc; text-shadow: 4px 4px #8b4513; font-size: 42px; margin: 5px; font-family: 'Times New Roman', serif; }
        .house-list { text-align: left; margin-top: 20px; font-size: 22px; }
        .g { color: #ae0001; } .r { color: #222f5b; } .s { color: #2a623d; } .h { color: #ecb939; }
    </style>
</head>
<body>

<div id="game-box">
    <div id="hud">
        <div id="lives-container">SOCKS: <span id="sockIcons">🧦🧦🧦</span></div>
        SCORE: <span id="scoreVal">0</span><br>
        WAVE: <span id="timerVal">30</span> | LVL: <span id="lvlVal">1</span>
    </div>

    <div id="ui-overlay">
        <div id="menu-start">
            <h1>CHOOSE YOUR HOUSE</h1>
            <div class="house-list">
                <p class="g">[1] GRYFFINDOR</p>
                <p class="r">[2] RAVENCLAW</p>
                <p class="s">[3] SLYTHERIN</p>
                <p class="h">[4] HUFFLEPUFF</p>
            </div>
            <div class="blink" style="margin-top:20px;">PRESS 1-4 TO BEGIN</div>
        </div>
        <div id="menu-over" style="display:none;">
            <h1>CASTLE OVERRUN</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Highest Level: <span id="finalLvl">1</span></p>
            <div class="blink">PRESS [ENTER] TO RE-SORT</div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const ui = document.getElementById('ui-overlay');
    const scoreText = document.getElementById('scoreVal');
    const timerText = document.getElementById('timerVal');
    const lvlText = document.getElementById('lvlVal');
    const sockText = document.getElementById('sockIcons');

    let playing = false, score = 0, lives = 3, timer = 30, level = 1, frame = 0, invuln = 0;
    let earned13kLife = false; // Flag for the 13k bonus
    let player = { x: 380, y: 530, w: 40, h: 50, movingLeft: false, movingRight: false, shooting: false, color: '#8d8d8d' };
    let lastShotTime = 0;
    const SHOT_DELAY = 340; 

    let pixies = [], bombs = [], shots = [], particles = [], snitch = null;
    const spellColors = ['#800080', '#8b0000']; 

    window.addEventListener('keydown', e => {
        if(!playing) {
            if(['1','2','3','4'].includes(e.key)) {
                const colors = {'1':'#ae0001', '2':'#222f5b', '3':'#2a623d', '4':'#ecb939'};
                startWithHouse(colors[e.key]);
            }
            if(e.code === 'Enter' && lives <= 0) location.reload(); 
        }
        if(e.code === 'ArrowLeft') { e.preventDefault(); player.movingLeft = true; }
        if(e.code === 'ArrowRight') { e.preventDefault(); player.movingRight = true; }
        if(e.code === 'Space') { e.preventDefault(); player.shooting = true; }
    });
    window.addEventListener('keyup', e => {
        if(e.code === 'ArrowLeft') player.movingLeft = false;
        if(e.code === 'ArrowRight') player.movingRight = false;
        if(e.code === 'Space') player.shooting = false;
    });

    function startWithHouse(color) {
        player.color = color;
        score = 0; lives = 3; timer = 30; level = 1; frame = 0;
        pixies = []; bombs = []; shots = []; particles = []; snitch = null;
        earned13kLife = false;
        playing = true; ui.style.display = 'none';
        requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        if(!playing) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        frame++;
        let currentTime = Date.now();
        if(invuln > 0) invuln--;

        // Timer / Level Up
        if(frame % 60 === 0) {
            timer--;
            timerText.innerText = timer;
            if(timer <= 0) { level++; timer = 30; lvlText.innerText = level; burst(400, 300, '#fff', 15); }
        }

        // 13,000 Points Bonus Life Check
        if(score >= 13000 && !earned13kLife) {
            lives++;
            earned13kLife = true;
            updateLivesDisplay();
            burst(player.x, player.y, '#00ff00', 30); // Green burst for extra life
        }

        if(player.movingLeft && player.x > 0) player.x -= 8;
        if(player.movingRight && player.x + player.w < 800) player.x += 8;

        // Shooting
        if(player.shooting && currentTime - lastShotTime > SHOT_DELAY) {
            const randCol = spellColors[Math.floor(Math.random() * spellColors.length)];
            shots.push({ x: player.x + 20, y: player.y, vy: -18, active: true, color: randCol });
            lastShotTime = currentTime;
        }

        // Snitch
        if(!snitch && Math.random() < 0.0004) snitch = { x: -50, y: 150 + Math.random() * 200, vx: 7 };
        if(snitch) {
            snitch.x += snitch.vx; snitch.y += Math.sin(frame * 0.2) * 6;
            if(snitch.x > 850) snitch = null;
        }

        // Projectile Logic
        shots.forEach((s) => {
            s.y += s.vy;
            if(s.y < -120) s.active = false;
            pixies.forEach((p) => {
                if(Math.hypot(s.x-(p.x+15), s.y-(p.y+15)) < 30) {
                    p.active = false; s.active = false; score += 100; burst(s.x, s.y, s.color, 8);
                }
            });
            if(snitch && Math.hypot(s.x-snitch.x, s.y-snitch.y) < 30) {
                snitch = null; s.active = false; score += 5000; 
                if(lives < 3) lives++; updateLivesDisplay();
                burst(s.x, s.y, 'gold', 30);
            }
        });
        shots = shots.filter(s => s.active);

        // Enemy Logic
        if(Math.random() < 0.02 + (level * 0.008)) {
            pixies.push({ x: Math.random() * 750, y: -50, vy: 2 + (level * 0.4), bt: Math.max(40, 100 - (level * 5)), active: true, offset: Math.random() * 100 });
        }
        pixies.forEach(p => {
            p.y += p.vy;
            p.x += Math.sin((frame + p.offset) * 0.05) * (2 + level * 0.2); 
            if(checkCollide(player, p.x, p.y, 20)) loseLife();
            p.bt--;
            if(p.bt <= 0) {
                bombs.push({ x: p.x + 15, y: p.y + 15, vy: 5 + (level * 0.5), active: true });
                p.bt = Math.max(50, 120 - (level * 5));
            }
            if(p.y > 600) p.active = false;
        });
        pixies = pixies.filter(p => p.active);

        bombs.forEach(b => {
            b.y += b.vy;
            if(checkCollide(player, b.x, b.y, 12)) { b.active = false; loseLife(); }
            if(b.y > 600) b.active = false;
        });
        bombs = bombs.filter(b => b.active);

        for(let i = particles.length - 1; i >= 0; i--) {
            particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].l--;
            if(particles[i].l <= 0) particles.splice(i, 1);
        }
        scoreText.innerText = score;
    }

    function checkCollide(rect, cx, cy, cr) {
        let dx = Math.abs(cx - rect.x - rect.w/2), dy = Math.abs(cy - rect.y - rect.h/2);
        if (dx > (rect.w/2 + cr) || dy > (rect.h/2 + cr)) return false;
        if (dx <= (rect.w/2) || dy <= (rect.h/2)) return true;
        return (dx-rect.w/2)**2 + (dy-rect.h/2)**2 <= cr**2;
    }

    function updateLivesDisplay() { sockText.innerText = "🧦".repeat(lives); }

    function loseLife() {
        if(invuln > 0) return;
        lives--; invuln = 60;
        updateLivesDisplay();
        if(lives <= 0) {
            playing = false; ui.style.display = 'flex';
            document.getElementById('menu-start').style.display = 'none';
            document.getElementById('menu-over').style.display = 'block';
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalLvl').innerText = level;
        }
    }

    function burst(x, y, c, n) {
        if(particles.length > 250) return;
        for(let i=0; i<n; i++) particles.push({x:x, y:y, vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12, l:25, c:c});
    }

    function draw() {
        // Wall
        ctx.fillStyle = '#b39274'; ctx.fillRect(0, 0, 800, 600);
        for(let y=0; y<600; y+=40) {
            for(let x=0; x<800; x+=80) {
                let off = (y % 80 === 0) ? 0 : 40;
                ctx.fillStyle = '#8b6d51'; ctx.fillRect(x+off, y, 80, 40);
                ctx.fillStyle = ((x+y)%120===0 ? '#a28163' : '#c2a385');
                ctx.fillRect(x+off+2, y+2, 76, 36);
            }
        }

        // Banners (Fraying)
        const bannerData = [
            { c: '#ae0001', s: '#e3a000', label: 'G' },
            { c: '#222f5b', s: '#946b2d', label: 'R' },
            { c: '#2a623d', s: '#aaaaaa', label: 'S' },
            { c: '#ecb939', s: '#000000', label: 'H' }
        ];
        bannerData.forEach((b, i) => {
            let bx = 60 + i * 195;
            ctx.fillStyle = b.c; ctx.fillRect(bx, 0, 90, 180);
            if (level < 2) {
                ctx.beginPath(); ctx.moveTo(bx, 180); ctx.lineTo(bx+45, 220); ctx.lineTo(bx+90, 180); ctx.fill();
            } else {
                ctx.fillRect(bx, 180, 20, 15); ctx.fillRect(bx+25, 180, 15, 30); 
                ctx.fillRect(bx+45, 180, 10, 10); ctx.fillRect(bx+60, 180, 20, 25);
            }
            ctx.fillStyle = b.s; ctx.font = 'bold 38px "Times New Roman", serif';
            ctx.fillText(b.label, bx+32, 100);
            if(level > 3) {
                ctx.fillStyle = '#332211'; ctx.fillRect(bx + 20, 50, 5, 5); ctx.fillRect(bx + 60, 120, 8, 8);
            }
        });

        // DARKNESS
        let darkness = Math.min(0.75, (level - 1) * 0.12);
        ctx.fillStyle = `rgba(0, 0, 0, ${darkness})`;
        ctx.fillRect(0, 0, 800, 600);

        // Dobby (Ears Horizontal)
        ctx.save(); if(invuln % 10 > 5) ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#e5c2a3'; 
        ctx.fillRect(player.x+8, player.y-2, 24, 22); // Head
        ctx.fillRect(player.x+18, player.y+10, 4, 6); // Nose
        
        // HORIZONTAL EARS
        ctx.fillRect(player.x-14, player.y+6, 18, 6); // Left Ear extending out
        ctx.fillRect(player.x+36, player.y+6, 18, 6); // Right Ear extending out
        
        ctx.fillStyle = '#fff'; ctx.fillRect(player.x+11, player.y+4, 6, 6); ctx.fillRect(player.x+23, player.y+4, 6, 6);
        ctx.fillStyle = '#4caf50'; ctx.fillRect(player.x+13, player.y+6, 3, 3); ctx.fillRect(player.x+25, player.y+6, 3, 3);
        ctx.fillStyle = player.color; ctx.fillRect(player.x+5, player.y+20, 30, 30); 
        ctx.fillStyle = '#e5c2a3'; 
        ctx.fillRect(player.x+2, player.y+25, 4, 15); ctx.fillRect(player.x+34, player.y+25, 4, 15);
        ctx.fillRect(player.x+10, player.y+50, 6, 4); ctx.fillRect(player.x+24, player.y+50, 6, 4);
        ctx.restore();

        // Pixies (With Eyes)
        pixies.forEach(p => {
            ctx.fillStyle = '#1e90ff'; ctx.fillRect(p.x+5, p.y+5, 20, 20);
            ctx.fillStyle = 'white'; ctx.globalAlpha = 0.4; ctx.fillRect(p.x-6, p.y+10, 11, 12); ctx.fillRect(p.x+25, p.y+10, 11, 12); ctx.globalAlpha = 1;
            ctx.fillStyle = '#ffff00'; ctx.fillRect(p.x+8, p.y+9, 4, 4); ctx.fillRect(p.x+18, p.y+9, 4, 4);
        });

        // THIN SHOT (100px long)
        shots.forEach(s => {
            ctx.fillStyle = s.color;
            ctx.fillRect(s.x-2, s.y, 4, 100); 
            ctx.fillStyle = '#fff'; ctx.fillRect(s.x-1, s.y, 2, 4); 
        });

        if(snitch) {
            ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(snitch.x, snitch.y, 7, 0, 7); ctx.fill();
            ctx.fillStyle = 'white'; ctx.fillRect(snitch.x-14, snitch.y-4, 10, 3); ctx.fillRect(snitch.x+4, snitch.y-4, 10, 3);
        }
        bombs.forEach(b => {
            ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, 7); ctx.fill();
            ctx.fillStyle = '#0f0'; ctx.font = '10px Arial'; ctx.fillText('☢', b.x-5, b.y+4);
        });
        particles.forEach(p => { ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4); });
    }
</script>
</body>
</html>
