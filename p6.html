 <!DOCTYPE html>
 <html>
 <head>

 	<script src = "https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
 </head>
 <body>
<script>
	function setup() {
  createCanvas(1200, 1200);
}

function draw() {
	background("#1d1e52")
	push()
	translate(x,y)
	rotate(frameCount * 0.0111)
	for (let i = 0; i < 11; i++) {
		for (let j = 0; j < 11; j++) {
		let x = i*100
		let y = j*100
  fill("#cca09d")
  circle(0, 0, 100);
    fill("red")
circle(0-20,0+50,50);
  fill("white")
  circle(0-40, 0-44, 24)
  text(i+"," + j, x, y)
  pop()
  }
}}

</script>
 </body>
 </html>
