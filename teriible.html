<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inkbound: The Crane Update</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: #202020;
        font-family: 'Courier New', Courier, monospace;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #gameContainer {
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    canvas {
        background-color: #f4f4f4; /* Paper color */
        display: block;
        border: 4px solid #444;
    }
    #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #333;
        font-weight: bold;
        pointer-events: none;
    }
    #level-title {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        color: rgba(0,0,0,0.5);
        display: none;
        pointer-events: none;
    }
</style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <div>HP: <span id="hpDisplay"></span></div>
        <div>FORM: <span id="formDisplay">Knight</span></div>
        <div>LAMINATION: <span id="sealDisplay">NO</span></div>
    </div>
    <div id="level-title">Level 1</div>
</div>

<script>
/**
 * INKBOUND: THE CRANE UPDATE (NO WATER FLINCH)
 * 9 Levels, 3 Enemies (Piranha, Cone, Crane)
 * Forms: Knight (Base), Kite (Unlocked by Seal)
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- COLORS ---
const C_PAPER = "#f4f4f4";
const C_INK = "#222222";
const C_KNIGHT = "#3498db";
const C_KITE = "#f1c40f"; // Gold
const C_WATER = "rgba(52, 152, 219, 0.6)";
const C_LAVA = "#e74c3c";
const C_CRANE_BODY = "#ffffff";
const C_CRANE_WING = "#333333";
const C_CONE = "#e67e22";
const C_PIRANHA = "#c0392b";

// GREEN SERENITY PALETTE (Level 9)
const GS_MINT = "#E8F1F2";
const GS_PALE = "#B3EFB2";
const GS_SAGE = "#7A9E7E";
const GS_MOSS = "#31493C";

// --- GAME STATE ---
let gameState = {
    level: 1,
    maxLevels: 9,
    hasSeal: false, // Unlocks Kite
    transitionTimer: 0
};

// --- INPUT ---
const keys = {
    left: false,
    right: false,
    up: false,
    down: false,
    z: false, // Jump / Flap
    x: false, // Attack / Dive
    c: false  // Transform
};

window.addEventListener('keydown', e => {
    if(e.key === "ArrowLeft") keys.left = true;
    if(e.key === "ArrowRight") keys.right = true;
    if(e.key === "ArrowUp") keys.up = true;
    if(e.key === "ArrowDown") keys.down = true;
    if(e.key.toLowerCase() === "z") keys.z = true;
    if(e.key.toLowerCase() === "x") keys.x = true;
    if(e.key.toLowerCase() === "c") handleTransformInput();
});

window.addEventListener('keyup', e => {
    if(e.key === "ArrowLeft") keys.left = false;
    if(e.key === "ArrowRight") keys.right = false;
    if(e.key === "ArrowUp") keys.up = false;
    if(e.key === "ArrowDown") keys.down = false;
    if(e.key.toLowerCase() === "z") keys.z = false;
    if(e.key.toLowerCase() === "x") keys.x = false;
    if(e.key.toLowerCase() === "c") keys.c = false;
});

function handleTransformInput() {
    if (gameState.hasSeal && !player.transformCooldown) {
        player.transform();
    }
}

// --- CAMERA ---
const camera = {
    x: 0,
    y: 0,
    update: function(target) {
        // Center player with smooth lerp
        let targetX = target.x - canvas.width / 2;
        let targetY = target.y - canvas.height / 2;
        
        // Boundaries
        targetX = Math.max(0, Math.min(targetX, currentLevelWidth - canvas.width));
        targetY = Math.max(0, Math.min(targetY, currentLevelHeight - canvas.height));
        
        this.x += (targetX - this.x) * 0.1;
        this.y += (targetY - this.y) * 0.1;
    }
};

// --- ENTITIES ---

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = 30;
        this.h = 40;
        this.vx = 0;
        this.vy = 0;
        this.form = 'knight'; // 'knight' or 'kite'
        this.hp = 5;
        this.maxHp = 5;
        this.grounded = false;
        this.invuln = 0;
        this.facingRight = true;
        this.transformCooldown = 0;
    }

    update() {
        // Form Specific Physics
        if (this.form === 'knight') {
            this.handleKnightPhysics();
        } else {
            this.handleKitePhysics();
        }

        // Apply Velocity
        this.x += this.vx;
        this.checkHorizontalCollisions();
        this.y += this.vy;
        this.checkVerticalCollisions();

        // Invulnerability
        if (this.invuln > 0) this.invuln--;
        if (this.transformCooldown > 0) this.transformCooldown--;

        // Screen/World Bounds
        if (this.y > currentLevelHeight + 100) this.respawn();
    }

    handleKnightPhysics() {
        const speed = 5;
        const gravity = 0.6;
        const jumpStr = -12;

        // Move
        if (keys.left) { this.vx = -speed; this.facingRight = false; }
        else if (keys.right) { this.vx = speed; this.facingRight = true; }
        else { this.vx *= 0.8; } // Friction

        // Jump
        if (keys.z && this.grounded) {
            this.vy = jumpStr;
            this.grounded = false;
        }

        this.vy += gravity;
    }

    handleKitePhysics() {
        const speed = 7;
        const gravity = 0.15; // floaty
        const flapStr = -4;

        // Move
        if (keys.left) { this.vx = -speed; this.facingRight = false; }
        else if (keys.right) { this.vx = speed; this.facingRight = true; }
        else { this.vx *= 0.95; } // Air resistance

        // Flap (Unlimited flight, but requires tapping)
        if (keys.z && !this.lastZ) {
            this.vy = flapStr;
        }
        this.lastZ = keys.z;

        // Dive
        if (keys.down) this.vy += 0.5;

        this.vy += gravity;
        if (this.vy > 4) this.vy = 4; // Terminal velocity
    }

    transform() {
        if (this.form === 'knight') {
            this.form = 'kite';
            this.w = 40; this.h = 20;
            // Pop effect
            particles.push(new Particle(this.x, this.y, C_KITE, 10));
        } else {
            this.form = 'knight';
            this.w = 30; this.h = 40;
            particles.push(new Particle(this.x, this.y, C_KNIGHT, 10));
        }
        this.transformCooldown = 30;
    }

    takeDamage(amount) {
        if (this.invuln > 0) return;

        this.hp -= amount;
        this.invuln = true;
        
        // --- UPDATED FLINCH LOGIC ---
        if (this.form === 'kite') {
            this.invuln = 30; // 0.5s (Short!)
        } else {
            this.invuln = 90; // 1.5s (Standard)
        }

        // Knockback
        this.vy = -6;
        this.vx = this.facingRight ? -8 : 8;

        if (this.hp <= 0) this.respawn();
    }

    respawn() {
        this.hp = this.maxHp;
        this.x = levelStart.x;
        this.y = levelStart.y;
        this.vx = 0; this.vy = 0;
        this.form = 'knight'; // Reset form on death
    }

    checkHorizontalCollisions() {
        for (let b of blocks) {
            if (rectIntersect(this.x + this.vx, this.y, this.w, this.h, b.x, b.y, b.w, b.h)) {
                if (this.vx > 0) this.x = b.x - this.w;
                else if (this.vx < 0) this.x = b.x + b.w;
                this.vx = 0;
            }
        }
    }

    checkVerticalCollisions() {
        this.grounded = false;
        for (let b of blocks) {
            if (rectIntersect(this.x, this.y + this.vy, this.w, this.h, b.x, b.y, b.w, b.h)) {
                if (this.vy > 0) { // Landing
                    this.y = b.y - this.h;
                    this.grounded = true;
                } else if (this.vy < 0) { // Head bonk
                    this.y = b.y + b.h;
                }
                this.vy = 0;
            }
        }
    }

    draw() {
        if (this.invuln > 0 && Math.floor(Date.now() / 50) % 2 === 0) return; // Flicker

        if (this.form === 'knight') {
            ctx.fillStyle = C_KNIGHT;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            // Visor
            ctx.fillStyle = "black";
            ctx.fillRect(this.facingRight ? this.x + 18 : this.x + 2, this.y + 8, 10, 4);
        } else {
            ctx.fillStyle = C_KITE;
            // Diamond Shape
            ctx.beginPath();
            ctx.moveTo(this.x + this.w/2, this.y);
            ctx.lineTo(this.x + this.w, this.y + this.h/2);
            ctx.lineTo(this.x + this.w/2, this.y + this.h);
            ctx.lineTo(this.x, this.y + this.h/2);
            ctx.fill();
            // String
            ctx.strokeStyle = "white";
            ctx.beginPath();
            ctx.moveTo(this.x + this.w/2, this.y + this.h);
            ctx.quadraticCurveTo(this.x + this.w/2 - (this.vx*2), this.y + this.h + 20, this.x + this.w/2, this.y + this.h + 40);
            ctx.stroke();
        }
    }
}

// --- ENEMIES ---

class Cone {
    constructor(x, y, w) {
        this.x = x; this.y = y;
        this.w = 30; this.h = 30;
        this.patrolStart = x;
        this.patrolEnd = x + w;
        this.speed = 2;
        this.dir = 1;
    }
    update() {
        this.x += this.speed * this.dir;
        if (this.x > this.patrolEnd || this.x < this.patrolStart) this.dir *= -1;
        
        if (rectIntersect(this.x, this.y, this.w, this.h, player.x, player.y, player.w, player.h)) {
            player.takeDamage(1);
        }
    }
    draw() {
        ctx.fillStyle = C_CONE;
        ctx.beginPath();
        ctx.moveTo(this.x + 15, this.y);
        ctx.lineTo(this.x + 30, this.y + 30);
        ctx.lineTo(this.x, this.y + 30);
        ctx.fill();
        // Eye
        ctx.fillStyle = "white";
        ctx.fillRect(this.x + 10 + (this.dir*2), this.y + 10, 10, 10);
        ctx.fillStyle = "black";
        ctx.fillRect(this.x + 13 + (this.dir*4), this.y + 13, 4, 4);
    }
}

class Piranha {
    constructor(x, y) {
        this.startX = x; this.startY = y;
        this.x = x; this.y = y;
        this.w = 20; this.h = 20;
        this.timer = 0;
    }
    update() {
        // Jump out of water
        this.timer += 0.05;
        this.y = this.startY + Math.sin(this.timer) * 80;
        
        if (rectIntersect(this.x, this.y, this.w, this.h, player.x, player.y, player.w, player.h)) {
            player.takeDamage(1);
        }
    }
    draw() {
        ctx.fillStyle = C_PIRANHA;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = "white"; // Teeth
        ctx.fillRect(this.x + 2, this.y + 2, 5, 5);
        ctx.fillRect(this.x + 12, this.y + 2, 5, 5);
    }
}

class Crane {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 50; this.h = 30;
        // --- CRANE UPDATES ---
        this.speed = 4; // Faster
        this.damage = 2; // Hurt more
        this.detectRange = 500; // Larger range
        
        this.state = 'fly';
        this.floatOffset = 0;
        this.wingFrame = 0;
    }
    
    update() {
        if (this.state === 'landed') {
            this.floatOffset = Math.sin(Date.now() / 300) * 3;
            return;
        }

        // Detection
        let dx = (player.x + player.w/2) - (this.x + this.w/2);
        let dy = (player.y + player.h/2) - (this.y + this.h/2);
        let dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < this.detectRange) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
            
            // Wing Animation (Simple toggle)
            if (Math.floor(Date.now() / 100) % 2 === 0) this.wingFrame = 1;
            else this.wingFrame = 0;
        }

        // Damage Player
        if (rectIntersect(this.x, this.y, this.w, this.h, player.x, player.y, player.w, player.h)) {
            player.takeDamage(this.damage);
        }

        // Check Water Landing
        for (let w of waters) {
            if (rectIntersect(this.x, this.y, this.w, this.h, w.x, w.y, w.w, w.h)) {
                this.state = 'landed';
                this.y = w.y - this.h + 10; // Sit in water
            }
        }
    }

    draw() {
        let drawY = this.y + (this.state === 'landed' ? this.floatOffset : 0);
        
        ctx.fillStyle = C_CRANE_BODY;
        // Body
        ctx.fillRect(this.x, drawY, this.w, this.h);
        // Neck/Head
        ctx.fillRect(this.x + this.w, drawY - 10, 10, 20);
        ctx.fillRect(this.x + this.w + 5, drawY - 10, 15, 8); // Beak
        
        // Wing
        ctx.fillStyle = C_CRANE_WING;
        if (this.state === 'landed') {
            ctx.fillRect(this.x + 10, drawY + 5, 30, 10); // Folded
        } else {
            if (this.wingFrame === 0) {
                // Wing Up
                ctx.beginPath();
                ctx.moveTo(this.x+10, drawY+10);
                ctx.lineTo(this.x+40, drawY+10);
                ctx.lineTo(this.x+25, drawY-20);
                ctx.fill();
            } else {
                // Wing Down
                ctx.beginPath();
                ctx.moveTo(this.x+10, drawY+10);
                ctx.lineTo(this.x+40, drawY+10);
                ctx.lineTo(this.x+25, drawY+30);
                ctx.fill();
            }
        }
    }
}

// --- WORLD OBJECTS ---
class Particle {
    constructor(x, y, color, size) {
        this.x = x; this.y = y; this.color = color; this.size = size;
        this.life = 20;
    }
    update() { this.life--; this.y--; }
    draw() {
        ctx.globalAlpha = this.life / 20;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1;
    }
}

class Water {
    constructor(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
    draw() { ctx.fillStyle = C_WATER; ctx.fillRect(this.x, this.y, this.w, this.h); }
}

class Seal {
    constructor(x, y) { this.x = x; this.y = y; this.w = 30; this.h = 30; this.collected = false; }
    draw() {
        if(this.collected) return;
        ctx.fillStyle = "gold";
        ctx.beginPath(); ctx.arc(this.x+15, this.y+15, 10, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "black"; ctx.lineWidth = 2; ctx.stroke();
    }
}

class Door {
    constructor(x, y) { this.x = x; this.y = y; this.w = 40; this.h = 60; }
    draw() { ctx.fillStyle = "#2c3e50"; ctx.fillRect(this.x, this.y, this.w, this.h); }
}

// --- LEVEL GENERATION (Compressed for 9 Levels) ---
let blocks = [], waters = [], enemies = [], particles = [], seal, door;
let levelStart = {x:50, y:50};
let currentLevelWidth = 0;
let currentLevelHeight = 0;
let player = new Player(50, 50);

function loadLevel(lvl) {
    blocks = []; waters = []; enemies = []; particles = [];
    seal = null; door = null;
    gameState.level = lvl;
    
    // Level Design Patterns
    // 1-3: Basics & Piranhas
    // 4-6: Verticality & Cones
    // 7-8: Hard Mix
    // 9: Green Serenity & Cranes
    
    let mapW = 1600; 
    if (lvl > 5) mapW = 2400;
    
    // Floor
    blocks.push({x:0, y:550, w:mapW, h:50}); 
    blocks.push({x:-50, y:0, w:50, h:600}); // Left wall
    blocks.push({x:mapW, y:0, w:50, h:600}); // Right wall

    // Proceduralish Generation based on Level
    for(let i=200; i<mapW-100; i+=250) {
        let h = Math.random() * 100 + 50;
        let y = 450 - (Math.random() * 100);
        
        if (lvl === 9) {
            // Level 9: Crane Platforms (High up)
            y = 200 + Math.random() * 200;
            blocks.push({x: i, y: y, w: 100, h: 20});
            enemies.push(new Crane(i + 20, y - 50)); // LOTS OF CRANES
        } else {
            // Standard Blocks
            blocks.push({x: i, y: y, w: 100, h: 20});
            if (lvl > 3 && Math.random() > 0.5) enemies.push(new Cone(i, y-30, 100));
        }
    }

    // Water Pits
    if (lvl !== 9) { // No water pits in Green Serenity (It's serene, maybe just decorative pools)
        for(let i=500; i<mapW-300; i+=600) {
            waters.push(new Water(i, 560, 150, 40));
            if (lvl <= 4) enemies.push(new Piranha(i+75, 560));
        }
    } else {
        // Safe Water for Cranes to land in Level 9
        waters.push(new Water(400, 500, 300, 50));
        waters.push(new Water(1000, 500, 300, 50));
    }

    // Seal (Unlock Kite)
    if (lvl === 2 && !gameState.hasSeal) {
        seal = new Seal(800, 300);
    }
    
    // Door
    door = new Door(mapW - 100, 490);
    
    levelStart.x = 50; 
    levelStart.y = 400;
    player.respawn();
    
    currentLevelWidth = mapW;
    currentLevelHeight = 600;

    // Show Level Title
    const title = document.getElementById('level-title');
    title.innerText = lvl === 9 ? "Level 9: Green Serenity" : "Level " + lvl;
    title.style.display = "block";
    setTimeout(() => title.style.display = "none", 2000);
}

// --- UTILS ---
function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
}

// --- MAIN LOOP ---

function drawBackground() {
    if (gameState.level === 9) {
        // GREEN SERENITY THEME
        ctx.fillStyle = GS_MINT;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(-camera.x * 0.2, -camera.y * 0.2); // Parallax
        ctx.fillStyle = GS_PALE;
        ctx.beginPath(); ctx.moveTo(0, 600); ctx.lineTo(400, 200); ctx.lineTo(1200, 600); ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(-camera.x * 0.5, -camera.y * 0.5);
        ctx.fillStyle = GS_SAGE;
        ctx.beginPath(); ctx.moveTo(200, 600); ctx.lineTo(600, 300); ctx.lineTo(1000, 600); ctx.fill();
        ctx.restore();
    } else {
        // Standard Paper Theme
        ctx.fillStyle = C_PAPER;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Grid lines
        ctx.strokeStyle = "#e0e0e0";
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }
    }
}

function gameLoop() {
    // Logic
    player.update();
    enemies.forEach(e => e.update());
    particles.forEach((p, i) => { p.update(); if(p.life<=0) particles.splice(i,1); });
    
    // Camera
    camera.update(player);

    // Seal Collection
    if (seal && !seal.collected && rectIntersect(player.x, player.y, player.w, player.h, seal.x, seal.y, seal.w, seal.h)) {
        seal.collected = true;
        gameState.hasSeal = true;
        alert("LAMINATION SEAL ACQUIRED! Press 'C' to switch to Kite Form!");
    }

    // Door / Level End
    if (rectIntersect(player.x, player.y, player.w, player.h, door.x, door.y, door.w, door.h)) {
        if (gameState.level < gameState.maxLevels) {
            loadLevel(gameState.level + 1);
        } else {
            alert("YOU WIN! THE INKBOUND JOURNEY IS COMPLETE!");
            gameState.level = 1;
            loadLevel(1);
        }
    }

    // Drawing
    drawBackground();
    
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Draw Blocks
    ctx.fillStyle = (gameState.level === 9) ? GS_MOSS : C_INK;
    blocks.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // Draw Water
    waters.forEach(w => w.draw());

    // Draw Objects
    if(seal) seal.draw();
    if(door) door.draw();
    
    enemies.forEach(e => e.draw());
    player.draw();
    particles.forEach(p => p.draw());

    ctx.restore();

    // UI Updates
    document.getElementById('hpDisplay').innerText = player.hp;
    document.getElementById('formDisplay').innerText = player.form.toUpperCase();
    document.getElementById('sealDisplay').innerText = gameState.hasSeal ? "YES" : "NO";

    requestAnimationFrame(gameLoop);
}

// Start
loadLevel(1);
gameLoop();

</script>
</body>
</html>
