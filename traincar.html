<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Train</title>
	<style type=text/css>
		#train{
			display: flex;
			gap: 12px;
		}
		.cart{
			border:3px solid peachpuff;
			min-width: 100px;
			height: 80px;
			text-align: center;
			position: relative;
		}
.cart:before {
content:"";
width:30px;
height: 30px;
border:7px solid peachpuff;
display: block;
border-radius: 50%;
position:absolute;
bottom:-15px;
left: 7px;
background-color: white;
}

.cart:after {
content:"";
width:30px;
height: 30px;
border:7px solid peachpuff;
display: block;
border-radius: 50%;
position:absolute;
bottom:-15px;
right: 7px;
background-color: white;
}

	</style>
</head>
<body>

<div id="train">


	<!-- <div class="cart">Me</div>
	<div class="cart">Myself</div>
	<div class="cart">I</div> -->
</div>


<input type="text" id="Newperson">
<button id="add-person">Add A Person, Any Person</button>
<button id="removePerson">Remove the Caboose</button>

<input type="color" value="#ff0000" id="pickler">
</body>
<script type="text/javascript">
	
let me = {
		name: "me",
		studentId: "c29me3",
		fav_color: "orange",
	}
	let dalton = {
		year:2025,
		studentNum: 500,
	}


	let someone = {
		name:"wheyy",
		studentId: "misterious",
		fav_color: "darkgoldenrod",
	}
let people = [me, someone, {name: "timy", studentId: "c29tc", fav_color:"peachpuff"}]
console.log(people)

	// let people = ["me","myself","I"]
	let train = document.getElementById("train")
	console.log(me.studentId)

	function maketrain(){
		train.innerHTML = ""
	for(let i=0; i< people.length; i++){
		console.log(people[i])
		let cart = document.createElement("div")
		cart.textContent = people[i].name
		cart.classList.add("cart")	
		train.appendChild(cart)
		cart.style.backgroundColor = people[i].fav_color
	}
}
	maketrain()
	let addPersonBtn = document.getElementById("add-person")
	addPersonBtn.addEventListener("click",function() {
		// console.log("wsp")
		let personInput = document.getElementById("Newperson")
		let pickler = document.getElementById("pickler")
		console.log(personInput.value)
		people.push({
			name: personInput.value,
			fav_color: pickler.value,
		})
		// people.push(personInput.value)
		maketrain()
	})
let Removeperson = document.getElementById("removePerson")
Removeperson.addEventListener("click",function(){
	people.pop()
	maketrain()
})
		


</script>
</html>
