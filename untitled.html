<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orbital Architect: Starlight</title>
    <style>
        body { margin: 0; background: #050608; overflow: hidden; font-family: 'Georgia', serif; user-select: none; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #aab; transition: opacity 1s; z-index: 10;
        }
        h1 { font-size: 50px; font-weight: normal; letter-spacing: 10px; margin: 0 0 20px 0; color: #fff; }
        p { font-size: 16px; letter-spacing: 2px; color: #667; }
        .hidden { opacity: 0; pointer-events: none; }
        #hud {
            position: absolute; bottom: 30px; left: 30px; color: #556; font-size: 14px; letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">
    <h1>ORBITAL</h1>
    <p>CLICK TO INITIALIZE SEQUENCE</p>
    <p style="font-size: 12px; margin-top: 50px;">(Click & Hold to create Gravity. Ignite the Suns.)</p>
</div>

<div id="hud">SYSTEM STABLE</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const hud = document.getElementById('hud');

let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- AUDIO SYSTEM ---
const AudioEngine = {
    ctx: null,
    masterGain: null,
    droneOsc: null,
    init: function() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.3;
        this.masterGain.connect(this.ctx.destination);

        // Background Drone
        this.droneOsc = this.ctx.createOscillator();
        this.droneOsc.type = 'sine';
        this.droneOsc.frequency.value = 55; 
        this.droneOsc.connect(this.masterGain);
        this.droneOsc.start();
        
        this.filter = this.ctx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.value = 200;
        this.droneOsc.disconnect();
        this.droneOsc.connect(this.filter);
        this.filter.connect(this.masterGain);
    },
    playCollect: function() {
        if (!this.ctx) return;
        // A deeper, more cosmic boom for the implosion
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.5); // Pitch drop
        
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 1);
        
        // High sparkle for the star birth
        setTimeout(() => {
            const osc2 = this.ctx.createOscillator();
            const gain2 = this.ctx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc2.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
            gain2.gain.setValueAtTime(0.05, this.ctx.currentTime);
            gain2.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
            osc2.connect(gain2);
            gain2.connect(this.masterGain);
            osc2.start();
            osc2.stop(this.ctx.currentTime + 0.5);
        }, 400); // Delay to match visual implosion
    },
    updateDrone: function(speed) {
        if (!this.droneOsc) return;
        const targetFreq = 55 + (speed * 2);
        this.droneOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.1);
        this.filter.frequency.setTargetAtTime(200 + (speed * 50), this.ctx.currentTime, 0.1);
    }
};

// --- GAME STATE ---
const GAME = {
    active: false,
    level: 0,
    gravityWell: { x: 0, y: 0, active: false, mass: 2000 },
    mouse: { x: 0, y: 0 },
    particles: [],
    ignitedStars: [] // Stores the permanent stars
};

// --- CLASSES ---

class IgnitedStar {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.alpha = 0;
        this.maxAlpha = Math.random() * 0.5 + 0.5;
        this.size = Math.random() * 2 + 1;
    }
    draw() {
        if (this.alpha < this.maxAlpha) this.alpha += 0.02;
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.fill();

        // Subtle twinkle
        if (Math.random() > 0.99) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fff';
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
}

class Comet {
    constructor() {
        this.reset();
        this.tail = [];
        for(let i=0; i<20; i++) this.tail.push({x: this.x, y: this.y});
    }

    reset() {
        this.x = 100;
        this.y = height / 2;
        this.vx = 4;
        this.vy = -2;
    }

    update() {
        // Gravity Logic
        if (GAME.gravityWell.active) {
            const dx = GAME.gravityWell.x - this.x;
            const dy = GAME.gravityWell.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const force = GAME.gravityWell.mass / (dist * dist); 
            const angle = Math.atan2(dy, dx);
            this.vx += Math.cos(angle) * force;
            this.vy += Math.sin(angle) * force;
        }

        this.x += this.vx;
        this.y += this.vy;

        // Tail Physics
        let targetX = this.x;
        let targetY = this.y;
        for(let i=0; i<this.tail.length; i++) {
            let seg = this.tail[i];
            let dx = targetX - seg.x;
            let dy = targetY - seg.y;
            seg.x += dx * 0.3;
            seg.y += dy * 0.3;
            targetX = seg.x;
            targetY = seg.y;
        }

        // Bounds
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;

        // Audio Link
        const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        AudioEngine.updateDrone(speed);
    }

    draw() {
        // Draw Tail
        ctx.beginPath();
        if (this.tail.length > 0) ctx.moveTo(this.tail[0].x, this.tail[0].y);
        for(let i=1; i<this.tail.length; i++) {
            const xc = (this.tail[i].x + this.tail[i-1].x) / 2;
            const yc = (this.tail[i].y + this.tail[i-1].y) / 2;
            ctx.quadraticCurveTo(this.tail[i-1].x, this.tail[i-1].y, xc, yc);
        }
        const grad = ctx.createLinearGradient(this.x, this.y, this.tail[this.tail.length-1].x, this.tail[this.tail.length-1].y);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Draw Head
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(255,255,255,0.8)';
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Target {
    constructor() {
        this.spawn();
        this.state = 'active'; // active, expanding, contracting
        this.animRadius = 0;
    }
    spawn() {
        this.x = Math.random() * (width - 200) + 100;
        this.y = Math.random() * (height - 200) + 100;
        this.baseRadius = 20;
        this.currentRadius = 20;
        this.pulse = 0;
        this.state = 'active';
    }
    
    triggerCollapse() {
        this.state = 'expanding';
        this.animRadius = this.baseRadius;
        // Initial Explosion Particles
        createExplosion(this.x, this.y, 5, 'out'); 
    }

    update() {
        if (this.state === 'active') {
            this.pulse += 0.05;
            this.currentRadius = this.baseRadius + Math.sin(this.pulse) * 2;
        } 
        else if (this.state === 'expanding') {
            // Rapid Expansion
            this.currentRadius += 4;
            if (this.currentRadius > 60) {
                this.state = 'contracting';
            }
        } 
        else if (this.state === 'contracting') {
            // Violent Contraction
            this.currentRadius *= 0.8; // Exponential decay (fast suck)
            if (this.currentRadius < 1) {
                // Birth a star
                GAME.ignitedStars.push(new IgnitedStar(this.x, this.y));
                GAME.level++;
                hud.innerText = "STARS IGNITED: " + GAME.level;
                this.spawn(); // Move to new location
            }
        }
    }

    draw() {
        // If contracting, draw the "Black Hole" effect
        if (this.state === 'contracting') {
             ctx.beginPath();
             ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI*2);
             ctx.fillStyle = '#000'; // Black core
             ctx.strokeStyle = '#fff'; // White event horizon
             ctx.lineWidth = 2;
             ctx.fill();
             ctx.stroke();
             return;
        }

        // Draw Ring
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI*2);
        
        if (this.state === 'expanding') {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
        } else {
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.lineWidth = 1;
        }
        ctx.stroke();

        // Draw Core (only if active)
        if (this.state === 'active') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
            ctx.fillStyle = '#fdcb6e';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#fdcb6e';
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
}

class Dust {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.5;
        this.a = Math.random();
    }
    draw() {
        ctx.fillStyle = `rgba(255,255,255,${this.a * 0.3})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

// --- LOGIC ---
const comet = new Comet();
const dust = [];
const target = new Target(); // Single target for focus

for(let i=0; i<100; i++) dust.push(new Dust());

function checkCollisions() {
    if (target.state === 'active') {
        const dx = comet.x - target.x;
        const dy = comet.y - target.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < target.currentRadius + 10) {
            target.triggerCollapse();
            AudioEngine.playCollect();
        }
    }
}

function createExplosion(x, y, speed, dir) {
    for(let i=0; i<15; i++) {
        GAME.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * speed,
            vy: (Math.random() - 0.5) * speed,
            life: 1.0,
            color: '#fff'
        });
    }
}

// --- INPUT ---
window.addEventListener('mousedown', (e) => {
    if (!GAME.active) {
        GAME.active = true;
        ui.classList.add('hidden');
        AudioEngine.init();
        return;
    }
    GAME.gravityWell.active = true;
});

window.addEventListener('mouseup', () => {
    GAME.gravityWell.active = false;
});

window.addEventListener('mousemove', (e) => {
    GAME.gravityWell.x = e.clientX;
    GAME.gravityWell.y = e.clientY;
    GAME.mouse.x = e.clientX;
    GAME.mouse.y = e.clientY;
});

// --- RENDER LOOP ---
function loop() {
    requestAnimationFrame(loop);

    // Clear with Fade (Trails)
    ctx.fillStyle = 'rgba(5, 6, 8, 0.2)';
    ctx.fillRect(0, 0, width, height);

    if (!GAME.active) return;

    // Draw Background Dust
    dust.forEach(d => d.draw());

    // Draw Ignited Stars (The permanent ones)
    GAME.ignitedStars.forEach(s => s.draw());

    // Logic
    comet.update();
    target.update();
    target.draw();
    checkCollisions();

    // Draw Gravity Well (Cursor)
    if (GAME.gravityWell.active) {
        ctx.beginPath();
        ctx.arc(GAME.gravityWell.x, GAME.gravityWell.y, 40, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(GAME.gravityWell.x, GAME.gravityWell.y);
        ctx.lineTo(comet.x, comet.y);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.stroke();
    } else {
        ctx.beginPath();
        ctx.arc(GAME.mouse.x, GAME.mouse.y, 2, 0, Math.PI*2);
        ctx.fillStyle = '#556';
        ctx.fill();
    }

    comet.draw();

    // Draw Particles
    GAME.particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.03;
        ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
        ctx.fillRect(p.x, p.y, 2, 2);
        if(p.life <= 0) GAME.particles.splice(i, 1);
    });
}

loop();

</script>
</body>
</html>
